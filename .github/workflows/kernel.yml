name: Build device tarball (kernel)

on:
  workflow_dispatch:

jobs:
  device-tarball:
    runs-on: ubuntu-22.04
    env:
      ADAPTATION_TOOLS_BRANCH: main

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install bc bison build-essential ca-certificates cpio curl fakeroot flex git img2simg jq kmod libssl-dev libtinfo5 lz4 python2 python3 sudo unzip wget xz-utils -y --no-install-recommends
          sudo ln -sf python2 /usr/bin/python
          sudo wget https://raw.githubusercontent.com/LineageOS/android_system_core/lineage-17.1/mkbootimg/mkbootimg.py -O /usr/bin/mkbootimg

      - name: Build device tarball
        run: |
          git clone https://gitlab.com/ubports/community-ports/halium-generic-adaptation-build-tools -b $ADAPTATION_TOOLS_BRANCH build
          ./build.sh

      - name: Upload device tarball to artifacts
        uses: actions/upload-artifact@v6
        with:
          name: device-tarball
          path: out/*
          if-no-files-found: error
